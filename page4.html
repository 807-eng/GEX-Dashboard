<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>GEX Dashboard 2026-11-23</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f9f7; color: #1a1a1a; padding: 0; }
  .header { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header-title { font-size: 12px; color: #666; }
  .page-link { font-size: 11px; color: #666; text-decoration: none; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; }
  .page-link:hover { background: #f0f0ee; }

  .panel { display: none; padding: 10px 14px; }

  table { border-collapse: collapse; width: auto; font-size: 11px; font-family: "SF Mono", "Fira Mono", "Consolas", monospace; }
  th { font-size: 10px; font-weight: 500; color: #aaa; padding: 3px 12px 3px 0; border-bottom: 0.5px solid #e8e8e8; text-align: left; white-space: nowrap; }
  td { padding: 3px 12px 3px 0; border-bottom: 0.5px solid #f0f0f0; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f4f4f2; }
  .red  { color: #8b1a1a; }
  .grn  { color: #2a5e1a; }
  .muted { color: #999; }
  .footer { font-size: 10px; color: #ccc; padding: 8px 14px; border-top: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">📊 GEX Dashboard &nbsp;2026-11-23 &nbsp;|&nbsp; Last updated: 2026-11-23 13:01 PST</span>
  <div class="page-links">
    <a href="index.html" class="page-link">Page 1</a>
    <a href="page2.html" class="page-link">Page 2</a>
    <a href="page3.html" class="page-link">Page 3</a>
  </div>
</div>
<div class="tabs" id="tab-container"></div>
<div id="panel-container"></div>
<div class="footer">Auto-updated every 10 min during market hours</div>
<script>
const data = {"SPY": [{"time": "12:44", "spot": 724.49, "gex_display": 690.4, "gex_unit": "M", "gex_at": 725.0, "gex2_display": 172.0, "gex2_unit": "M", "gex2_at": 726.0, "gex3_display": 111.9, "gex3_unit": "M", "gex3_at": 723.0, "net_gamma_display": 1.2, "net_gamma_unit": "B", "call_gamma_display": 2.1, "call_gamma_unit": "B", "put_gamma_display": -935.2, "put_gamma_unit": "M", "mp": 728.0, "cw": 725.0, "pw": 719.0}, {"time": "12:51", "spot": 722.41, "gex_display": 575.0, "gex_unit": "M", "gex_at": 725.0, "gex2_display": 150.0, "gex2_unit": "M", "gex2_at": 720.0, "gex3_display": 149.8, "gex3_unit": "M", "gex3_at": 726.0, "net_gamma_display": 1.6, "net_gamma_unit": "B", "call_gamma_display": 2.4, "call_gamma_unit": "B", "put_gamma_display": -770.4, "put_gamma_unit": "M", "mp": 724.0, "cw": 725.0, "pw": 724.0}, {"time": "13:01", "spot": 721.81, "gex_display": 392.4, "gex_unit": "M", "gex_at": 725.0, "gex2_display": 225.6, "gex2_unit": "M", "gex2_at": 723.0, "gex3_display": -175.7, "gex3_unit": "M", "gex3_at": 720.0, "net_gamma_display": 738.6, "net_gamma_unit": "M", "call_gamma_display": 1.7, "call_gamma_unit": "B", "put_gamma_display": -924.6, "put_gamma_unit": "M", "mp": 721.0, "cw": 725.0, "pw": 720.0}], "QQQ": [{"time": "12:44", "spot": 653.37, "gex_display": 127.4, "gex_unit": "M", "gex_at": 650.0, "gex2_display": 102.0, "gex2_unit": "M", "gex2_at": 655.0, "gex3_display": 88.3, "gex3_unit": "M", "gex3_at": 651.0, "net_gamma_display": 590.2, "net_gamma_unit": "M", "call_gamma_display": 1.0, "call_gamma_unit": "B", "put_gamma_display": -414.5, "put_gamma_unit": "M", "mp": 647.0, "cw": 650.0, "pw": 645.0}, {"time": "12:51", "spot": 650.91, "gex_display": 209.6, "gex_unit": "M", "gex_at": 650.0, "gex2_display": 122.4, "gex2_unit": "M", "gex2_at": 651.0, "gex3_display": 89.9, "gex3_unit": "M", "gex3_at": 655.0, "net_gamma_display": 836.0, "net_gamma_unit": "M", "call_gamma_display": 1.2, "call_gamma_unit": "B", "put_gamma_display": -376.6, "put_gamma_unit": "M", "mp": 659.0, "cw": 650.0, "pw": 665.0}, {"time": "13:01", "spot": 651.0, "gex_display": 312.0, "gex_unit": "M", "gex_at": 650.0, "gex2_display": 179.5, "gex2_unit": "M", "gex2_at": 651.0, "gex3_display": 57.8, "gex3_unit": "M", "gex3_at": 652.0, "net_gamma_display": 687.0, "net_gamma_unit": "M", "call_gamma_display": 1.1, "call_gamma_unit": "B", "put_gamma_display": -439.5, "put_gamma_unit": "M", "mp": 649.0, "cw": 650.0, "pw": 648.0}], "IWM": [{"time": "12:44", "spot": 265.53, "gex_display": -31.7, "gex_unit": "M", "gex_at": 270.0, "gex2_display": 16.5, "gex2_unit": "M", "gex2_at": 265.0, "gex3_display": 10.0, "gex3_unit": "M", "gex3_at": 266.0, "net_gamma_display": 19.2, "net_gamma_unit": "M", "call_gamma_display": 155.5, "call_gamma_unit": "M", "put_gamma_display": -136.4, "put_gamma_unit": "M", "mp": 264.0, "cw": 265.0, "pw": 270.0}, {"time": "12:51", "spot": 265.09, "gex_display": -31.9, "gex_unit": "M", "gex_at": 270.0, "gex2_display": 10.0, "gex2_unit": "M", "gex2_at": 266.0, "gex3_display": -9.3, "gex3_unit": "M", "gex3_at": 267.0, "net_gamma_display": -5.4, "net_gamma_unit": "M", "call_gamma_display": 160.3, "call_gamma_unit": "M", "put_gamma_display": -165.7, "put_gamma_unit": "M", "mp": 267.0, "cw": 266.0, "pw": 270.0}, {"time": "13:01", "spot": 265.56, "gex_display": 18.8, "gex_unit": "M", "gex_at": 265.0, "gex2_display": 18.6, "gex2_unit": "M", "gex2_at": 264.0, "gex3_display": 10.0, "gex3_unit": "M", "gex3_at": 266.0, "net_gamma_display": 58.7, "net_gamma_unit": "M", "call_gamma_display": 154.0, "call_gamma_unit": "M", "put_gamma_display": -95.4, "put_gamma_unit": "M", "mp": 267.0, "cw": 265.0, "pw": 267.0}]};
const tickers = ["SPY", "QQQ", "IWM"];

const tabContainer = document.getElementById("tab-container");
const panelContainer = document.getElementById("panel-container");

tickers.forEach((ticker, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = ticker;
  btn.onclick = () => show(ticker, btn);
  tabContainer.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = ticker;
  panel.className = "panel" + (i === 0 ? " active" : "");
  const rows = data[ticker] || [];
  const rowsHtml = rows.map(r => {
    const fmtGex = (display, unit, at) => {
      if (display === null || display === undefined) return {html: "<span class=\"muted\">—</span>", cls: "muted"};
      const isRed = display < 0;
      const abs = Math.abs(display);
      const u = abs >= 1000 ? (abs/1000).toFixed(1)+"B" : abs+unit;
      const atStr = (at === null || at === undefined) ? "" : (" @$" + at);
      const gexStr = (isRed ? "-" : "+") + "$" + u + atStr;
      const cls = isRed ? "red" : "grn";
      const dot = isRed ? "🔴" : "🟢";
      return {html: dot + " " + gexStr, cls: cls};
    };
    const g1 = fmtGex(r.gex_display, r.gex_unit, r.gex_at);
    const g2 = fmtGex(r.gex2_display, r.gex2_unit, r.gex2_at);
    const g3 = fmtGex(r.gex3_display, r.gex3_unit, r.gex3_at);
    const ng = fmtGex(r.net_gamma_display, r.net_gamma_unit, null);
    const cg = fmtGex(r.call_gamma_display, r.call_gamma_unit, null);
    const pg = fmtGex(r.put_gamma_display, r.put_gamma_unit, null);
    return "<tr><td>" + r.time + "</td><td>$" + r.spot.toFixed(2) + "</td>"
      + "<td class=\"" + g1.cls + "\">" + g1.html + "</td>"
      + "<td class=\"" + g2.cls + "\">" + g2.html + "</td>"
      + "<td class=\"" + g3.cls + "\">" + g3.html + "</td>"
      + "<td class=\"" + ng.cls + "\">" + ng.html + "</td>"
      + "<td class=\"" + cg.cls + "\">" + cg.html + "</td>"
      + "<td class=\"" + pg.cls + "\">" + pg.html + "</td>"
      + "<td class=\"muted\">$" + r.mp + "</td>"
      + "<td class=\"muted\">$" + r.cw + "</td>"
      + "<td class=\"muted\">$" + r.pw + "</td></tr>";
  }).join("");
  panel.innerHTML = "<table><thead><tr><th>Time</th><th>Price</th><th>GEX</th><th>GEX2</th><th>GEX3</th><th>Net Gamma</th><th>Call Gamma</th><th>Put Gamma</th><th>MP</th><th>CW</th><th>PW</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  panelContainer.appendChild(panel);
});

function show(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
</script>
</body>
</html>
