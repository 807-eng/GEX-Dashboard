<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEX Dashboard 2026-10-16</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f9f7; color: #1a1a1a; padding: 0; }
  .header { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header-title { font-size: 12px; color: #666; }
  .page-link { font-size: 11px; color: #666; text-decoration: none; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; }
  .page-link:hover { background: #f0f0ee; }
  .page-links { display: flex; gap: 6px; }
  .tabs { display: flex; gap: 4px; padding: 10px 14px; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
  .tab { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; padding: 4px 14px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; background: transparent; color: #888; white-space: nowrap; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .panel { display: none; padding: 10px 14px; }
  .panel.active { display: block; }
  table { border-collapse: collapse; width: auto; font-size: 11px; font-family: "SF Mono", "Fira Mono", "Consolas", monospace; }
  th { font-size: 10px; font-weight: 500; color: #aaa; padding: 3px 12px 3px 0; border-bottom: 0.5px solid #e8e8e8; text-align: left; white-space: nowrap; }
  td { padding: 3px 12px 3px 0; border-bottom: 0.5px solid #f0f0f0; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f4f4f2; }
  .red  { color: #8b1a1a; }
  .grn  { color: #2a5e1a; }
  .muted { color: #999; }
  .footer { font-size: 10px; color: #ccc; padding: 8px 14px; border-top: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">📊 GEX Dashboard &nbsp;2026-10-16 &nbsp;|&nbsp; Last updated: 2026-10-16 07:35 PST</span>
  <div class="page-links">
    <a href="index.html" class="page-link">Page 1</a>
    <a href="page2.html" class="page-link">Page 2</a>
    <a href="page3.html" class="page-link">Page 3</a>
  </div>
</div>
<div class="tabs" id="tab-container"></div>
<div id="panel-container"></div>
<div class="footer">Auto-updated every 10 min during market hours</div>
<script>
const data = {"SPY": [{"time": "06:56", "spot": 771.43, "gex_display": 3.2, "gex_unit": "M", "gex_at": 756.0, "gex2_display": 0.5, "gex2_unit": "M", "gex2_at": 701.0, "gex3_display": 0.4, "gex3_unit": "M", "gex3_at": 747.0, "net_gamma_display": 5.1, "net_gamma_unit": "M", "call_gamma_display": 5.2, "call_gamma_unit": "M", "put_gamma_display": -0.1, "put_gamma_unit": "M", "mp": 784.0, "cw": 756.0, "pw": 786.0}, {"time": "07:08", "spot": 771.65, "gex_display": 2.9, "gex_unit": "M", "gex_at": 759.0, "gex2_display": 1.2, "gex2_unit": "M", "gex2_at": 753.0, "gex3_display": 0.9, "gex3_unit": "M", "gex3_at": 752.0, "net_gamma_display": 7.4, "net_gamma_unit": "M", "call_gamma_display": 7.6, "call_gamma_unit": "M", "put_gamma_display": -0.1, "put_gamma_unit": "M", "mp": 784.0, "cw": 759.0, "pw": 786.0}, {"time": "07:35", "spot": 771.42, "gex_display": -2.0, "gex_unit": "B", "gex_at": 772.0, "gex2_display": 1.5, "gex2_unit": "B", "gex2_at": 775.0, "gex3_display": 571.6, "gex3_unit": "M", "gex3_at": 776.0, "net_gamma_display": -869.1, "net_gamma_unit": "M", "call_gamma_display": 9.9, "call_gamma_unit": "B", "put_gamma_display": -10.8, "put_gamma_unit": "B", "mp": 771.0, "cw": 775.0, "pw": 772.0}], "QQQ": [{"time": "06:56", "spot": 721.5, "gex_display": 121.7, "gex_unit": "M", "gex_at": 712.0, "gex2_display": 13.5, "gex2_unit": "M", "gex2_at": 705.0, "gex3_display": 12.1, "gex3_unit": "M", "gex3_at": 711.0, "net_gamma_display": 151.8, "net_gamma_unit": "M", "call_gamma_display": 180.9, "call_gamma_unit": "M", "put_gamma_display": -29.2, "put_gamma_unit": "M", "mp": 704.0, "cw": 712.0, "pw": 703.0}, {"time": "07:08", "spot": 721.57, "gex_display": -819.2, "gex_unit": "M", "gex_at": 723.0, "gex2_display": -715.0, "gex2_unit": "M", "gex2_at": 722.0, "gex3_display": -512.1, "gex3_unit": "M", "gex3_at": 721.0, "net_gamma_display": -4.5, "net_gamma_unit": "B", "call_gamma_display": 3.8, "call_gamma_unit": "B", "put_gamma_display": -8.3, "put_gamma_unit": "B", "mp": 726.0, "cw": 728.0, "pw": 723.0}, {"time": "07:35", "spot": 720.47, "gex_display": -961.6, "gex_unit": "M", "gex_at": 723.0, "gex2_display": -851.9, "gex2_unit": "M", "gex2_at": 722.0, "gex3_display": -556.8, "gex3_unit": "M", "gex3_at": 717.0, "net_gamma_display": -4.9, "net_gamma_unit": "B", "call_gamma_display": 3.9, "call_gamma_unit": "B", "put_gamma_display": -8.8, "put_gamma_unit": "B", "mp": 720.0, "cw": 728.0, "pw": 723.0}], "IWM": [{"time": "06:56", "spot": 275.28, "gex_display": -687.6, "gex_unit": "M", "gex_at": 275.0, "gex2_display": -347.5, "gex2_unit": "M", "gex2_at": 273.0, "gex3_display": -306.1, "gex3_unit": "M", "gex3_at": 274.0, "net_gamma_display": -2.5, "net_gamma_unit": "B", "call_gamma_display": 1.4, "call_gamma_unit": "B", "put_gamma_display": -3.9, "put_gamma_unit": "B", "mp": 282.0, "cw": 287.0, "pw": 275.0}, {"time": "07:08", "spot": 274.9, "gex_display": -653.0, "gex_unit": "M", "gex_at": 275.0, "gex2_display": -352.8, "gex2_unit": "M", "gex2_at": 273.0, "gex3_display": -304.0, "gex3_unit": "M", "gex3_at": 274.0, "net_gamma_display": -2.3, "net_gamma_unit": "B", "call_gamma_display": 1.4, "call_gamma_unit": "B", "put_gamma_display": -3.7, "put_gamma_unit": "B", "mp": 281.0, "cw": 281.0, "pw": 275.0}, {"time": "07:35", "spot": 274.68, "gex_display": -972.6, "gex_unit": "M", "gex_at": 275.0, "gex2_display": -403.7, "gex2_unit": "M", "gex2_at": 273.0, "gex3_display": -370.2, "gex3_unit": "M", "gex3_at": 274.0, "net_gamma_display": -2.8, "net_gamma_unit": "B", "call_gamma_display": 1.4, "call_gamma_unit": "B", "put_gamma_display": -4.2, "put_gamma_unit": "B", "mp": 281.0, "cw": 286.0, "pw": 275.0}]};
const tickers = ["SPY", "QQQ", "IWM"];

const tabContainer = document.getElementById("tab-container");
const panelContainer = document.getElementById("panel-container");

tickers.forEach((ticker, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = ticker;
  btn.onclick = () => show(ticker, btn);
  tabContainer.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = ticker;
  panel.className = "panel" + (i === 0 ? " active" : "");
  const rows = data[ticker] || [];
  const rowsHtml = rows.map(r => {
    const fmtGex = (display, unit, at) => {
      if (display === null || display === undefined) return {html: "<span class=\"muted\">—</span>", cls: "muted"};
      const isRed = display < 0;
      const abs = Math.abs(display);
      const u = abs >= 1000 ? (abs/1000).toFixed(1)+"B" : abs+unit;
      const atStr = (at === null || at === undefined) ? "" : (" @$" + at);
      const gexStr = (isRed ? "-" : "+") + "$" + u + atStr;
      const cls = isRed ? "red" : "grn";
      const dot = isRed ? "🔴" : "🟢";
      return {html: dot + " " + gexStr, cls: cls};
    };
    const g1 = fmtGex(r.gex_display, r.gex_unit, r.gex_at);
    const g2 = fmtGex(r.gex2_display, r.gex2_unit, r.gex2_at);
    const g3 = fmtGex(r.gex3_display, r.gex3_unit, r.gex3_at);
    const ng = fmtGex(r.net_gamma_display, r.net_gamma_unit, null);
    const cg = fmtGex(r.call_gamma_display, r.call_gamma_unit, null);
    const pg = fmtGex(r.put_gamma_display, r.put_gamma_unit, null);
    return "<tr><td>" + r.time + "</td><td>$" + r.spot.toFixed(2) + "</td>"
      + "<td class=\"" + g1.cls + "\">" + g1.html + "</td>"
      + "<td class=\"" + g2.cls + "\">" + g2.html + "</td>"
      + "<td class=\"" + g3.cls + "\">" + g3.html + "</td>"
      + "<td class=\"" + ng.cls + "\">" + ng.html + "</td>"
      + "<td class=\"" + cg.cls + "\">" + cg.html + "</td>"
      + "<td class=\"" + pg.cls + "\">" + pg.html + "</td>"
      + "<td class=\"muted\">$" + r.mp + "</td>"
      + "<td class=\"muted\">$" + r.cw + "</td>"
      + "<td class=\"muted\">$" + r.pw + "</td></tr>";
  }).join("");
  panel.innerHTML = "<table><thead><tr><th>Time</th><th>Price</th><th>GEX</th><th>GEX2</th><th>GEX3</th><th>Net Gamma</th><th>Call Gamma</th><th>Put Gamma</th><th>MP</th><th>CW</th><th>PW</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  panelContainer.appendChild(panel);
});

function show(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
</script>
</body>
</html>
