<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEX Dashboard 2026-09-01</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f9f7; color: #1a1a1a; padding: 0; }
  .header { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header-title { font-size: 12px; color: #666; }
  .page-link { font-size: 11px; color: #666; text-decoration: none; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; }
  .page-link:hover { background: #f0f0ee; }
  .page-links { display: flex; gap: 6px; }
  .tabs { display: flex; gap: 4px; padding: 10px 14px; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
  .tab { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; padding: 4px 14px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; background: transparent; color: #888; white-space: nowrap; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .panel { display: none; padding: 10px 14px; }
  .panel.active { display: block; }
  table { border-collapse: collapse; width: auto; font-size: 11px; font-family: "SF Mono", "Fira Mono", "Consolas", monospace; }
  th { font-size: 10px; font-weight: 500; color: #aaa; padding: 3px 12px 3px 0; border-bottom: 0.5px solid #e8e8e8; text-align: left; white-space: nowrap; }
  td { padding: 3px 12px 3px 0; border-bottom: 0.5px solid #f0f0f0; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f4f4f2; }
  .red  { color: #8b1a1a; }
  .grn  { color: #2a5e1a; }
  .muted { color: #999; }
  .footer { font-size: 10px; color: #ccc; padding: 8px 14px; border-top: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">📊 GEX Dashboard &nbsp;2026-09-01 &nbsp;|&nbsp; Last updated: 2026-09-01 10:50 PST</span>
  <div class="page-links">
    <a href="index.html" class="page-link">Page 1</a>
    <a href="page2.html" class="page-link">Page 2</a>
    <a href="page3.html" class="page-link">Page 3</a>
  </div>
</div>
<div class="tabs" id="tab-container"></div>
<div id="panel-container"></div>
<div class="footer">Auto-updated every 10 min during market hours</div>
<script>
const data = {"SPY": [{"time": "10:31", "spot": 761.52, "gex_display": -633.8, "gex_unit": "M", "gex_at": 762.0, "gex2_display": -589.2, "gex2_unit": "M", "gex2_at": 763.0, "gex3_display": -487.5, "gex3_unit": "M", "gex3_at": 761.0, "net_gamma_display": -2.5, "net_gamma_unit": "B", "call_gamma_display": 1.1, "call_gamma_unit": "B", "put_gamma_display": -3.6, "put_gamma_unit": "B", "mp": 766.0, "cw": 766.0, "pw": 762.0}, {"time": "10:50", "spot": 762.01, "gex_display": -724.3, "gex_unit": "M", "gex_at": 763.0, "gex2_display": -691.0, "gex2_unit": "M", "gex2_at": 762.0, "gex3_display": -458.2, "gex3_unit": "M", "gex3_at": 761.0, "net_gamma_display": -3.0, "net_gamma_unit": "B", "call_gamma_display": 1.2, "call_gamma_unit": "B", "put_gamma_display": -4.1, "put_gamma_unit": "B", "mp": 767.0, "cw": 767.0, "pw": 763.0}], "QQQ": [{"time": "10:31", "spot": 707.49, "gex_display": -283.7, "gex_unit": "M", "gex_at": 707.0, "gex2_display": -275.6, "gex2_unit": "M", "gex2_at": 710.0, "gex3_display": -164.7, "gex3_unit": "M", "gex3_at": 706.0, "net_gamma_display": -2.1, "net_gamma_unit": "B", "call_gamma_display": 535.8, "call_gamma_unit": "M", "put_gamma_display": -2.7, "put_gamma_unit": "B", "mp": 714.0, "cw": 714.0, "pw": 708.0}, {"time": "10:50", "spot": 707.75, "gex_display": -984.5, "gex_unit": "M", "gex_at": 708.0, "gex2_display": -306.7, "gex2_unit": "M", "gex2_at": 707.0, "gex3_display": -280.0, "gex3_unit": "M", "gex3_at": 710.0, "net_gamma_display": -2.1, "net_gamma_unit": "B", "call_gamma_display": 573.0, "call_gamma_unit": "M", "put_gamma_display": -2.7, "put_gamma_unit": "B", "mp": 714.0, "cw": 714.0, "pw": 708.0}], "IWM": [{"time": "10:31", "spot": 290.83, "gex_display": -174.0, "gex_unit": "M", "gex_at": 291.0, "gex2_display": -85.0, "gex2_unit": "M", "gex2_at": 290.0, "gex3_display": -20.0, "gex3_unit": "M", "gex3_at": 292.0, "net_gamma_display": -308.2, "net_gamma_unit": "M", "call_gamma_display": 18.5, "call_gamma_unit": "M", "put_gamma_display": -326.7, "put_gamma_unit": "M", "mp": 299.0, "cw": 299.0, "pw": 291.0}, {"time": "10:50", "spot": 290.78, "gex_display": -183.9, "gex_unit": "M", "gex_at": 291.0, "gex2_display": -86.5, "gex2_unit": "M", "gex2_at": 290.0, "gex3_display": -19.9, "gex3_unit": "M", "gex3_at": 292.0, "net_gamma_display": -315.1, "net_gamma_unit": "M", "call_gamma_display": 12.7, "call_gamma_unit": "M", "put_gamma_display": -327.8, "put_gamma_unit": "M", "mp": 293.0, "cw": 299.0, "pw": 291.0}]};
const tickers = ["SPY", "QQQ", "IWM"];

const tabContainer = document.getElementById("tab-container");
const panelContainer = document.getElementById("panel-container");

tickers.forEach((ticker, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = ticker;
  btn.onclick = () => show(ticker, btn);
  tabContainer.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = ticker;
  panel.className = "panel" + (i === 0 ? " active" : "");
  const rows = data[ticker] || [];
  const rowsHtml = rows.map(r => {
    const fmtGex = (display, unit, at) => {
      if (display === null || display === undefined) return {html: "<span class=\"muted\">—</span>", cls: "muted"};
      const isRed = display < 0;
      const abs = Math.abs(display);
      const u = abs >= 1000 ? (abs/1000).toFixed(1)+"B" : abs+unit;
      const atStr = (at === null || at === undefined) ? "" : (" @$" + at);
      const gexStr = (isRed ? "-" : "+") + "$" + u + atStr;
      const cls = isRed ? "red" : "grn";
      const dot = isRed ? "🔴" : "🟢";
      return {html: dot + " " + gexStr, cls: cls};
    };
    const g1 = fmtGex(r.gex_display, r.gex_unit, r.gex_at);
    const g2 = fmtGex(r.gex2_display, r.gex2_unit, r.gex2_at);
    const g3 = fmtGex(r.gex3_display, r.gex3_unit, r.gex3_at);
    const ng = fmtGex(r.net_gamma_display, r.net_gamma_unit, null);
    const cg = fmtGex(r.call_gamma_display, r.call_gamma_unit, null);
    const pg = fmtGex(r.put_gamma_display, r.put_gamma_unit, null);
    return "<tr><td>" + r.time + "</td><td>$" + r.spot.toFixed(2) + "</td>"
      + "<td class=\"" + g1.cls + "\">" + g1.html + "</td>"
      + "<td class=\"" + g2.cls + "\">" + g2.html + "</td>"
      + "<td class=\"" + g3.cls + "\">" + g3.html + "</td>"
      + "<td class=\"" + ng.cls + "\">" + ng.html + "</td>"
      + "<td class=\"" + cg.cls + "\">" + cg.html + "</td>"
      + "<td class=\"" + pg.cls + "\">" + pg.html + "</td>"
      + "<td class=\"muted\">$" + r.mp + "</td>"
      + "<td class=\"muted\">$" + r.cw + "</td>"
      + "<td class=\"muted\">$" + r.pw + "</td></tr>";
  }).join("");
  panel.innerHTML = "<table><thead><tr><th>Time</th><th>Price</th><th>GEX</th><th>GEX2</th><th>GEX3</th><th>Net Gamma</th><th>Call Gamma</th><th>Put Gamma</th><th>MP</th><th>CW</th><th>PW</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  panelContainer.appendChild(panel);
});

function show(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
</script>
</body>
</html>
