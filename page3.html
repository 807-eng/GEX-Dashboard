const tickers = ["GOOGL", "META", "MU"];

const tabContainer = document.getElementById("tab-container");
const panelContainer = document.getElementById("panel-container");

tickers.forEach((ticker, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = ticker;
  btn.onclick = () => show(ticker, btn);
  tabContainer.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = ticker;
  panel.className = "panel" + (i === 0 ? " active" : "");
  const rows = data[ticker] || [];
  const rowsHtml = rows.map(r => {
    const fmtGex = (display, unit, at) => {
      if (display === null || display === undefined) return {html: "<span class=\"muted\">—</span>", cls: "muted"};
      const isRed = display < 0;
      const abs = Math.abs(display);
      const u = abs >= 1000 ? (abs/1000).toFixed(1)+"B" : abs+unit;
      const atStr = (at === null || at === undefined) ? "" : (" @$" + at);
      const gexStr = (isRed ? "-" : "+") + "$" + u + atStr;
      const cls = isRed ? "red" : "grn";
      const dot = isRed ? "🔴" : "🟢";
      return {html: dot + " " + gexStr, cls: cls};
    };
    const g1 = fmtGex(r.gex_display, r.gex_unit, r.gex_at);
    const g2 = fmtGex(r.gex2_display, r.gex2_unit, r.gex2_at);
    const g3 = fmtGex(r.gex3_display, r.gex3_unit, r.gex3_at);
    const ng = fmtGex(r.net_gamma_display, r.net_gamma_unit, null);
    const cg = fmtGex(r.call_gamma_display, r.call_gamma_unit, null);
    const pg = fmtGex(r.put_gamma_display, r.put_gamma_unit, null);
    return "<tr><td>" + r.time + "</td><td>$" + r.spot.toFixed(2) + "</td>"
      + "<td class=\"" + g1.cls + "\">" + g1.html + "</td>"
      + "<td class=\"" + g2.cls + "\">" + g2.html + "</td>"
      + "<td class=\"" + g3.cls + "\">" + g3.html + "</td>"
      + "<td class=\"" + ng.cls + "\">" + ng.html + "</td>"
      + "<td class=\"" + cg.cls + "\">" + cg.html + "</td>"
      + "<td class=\"" + pg.cls + "\">" + pg.html + "</td>"
      + "<td class=\"muted\">$" + r.mp + "</td>"
      + "<td class=\"muted\">$" + r.cw + "</td>"
      + "<td class=\"muted\">$" + r.pw + "</td></tr>";
  }).join("");
  panel.innerHTML = "<table><thead><tr><th>Time</th><th>Price</th><th>GEX</th><th>GEX2</th><th>GEX3</th><th>Net Gamma</th><th>Call Gamma</th><th>Put Gamma</th><th>MP</th><th>CW</th><th>PW</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  panelContainer.appendChild(panel);
});

function show(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
</script>
