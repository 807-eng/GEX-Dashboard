<style>

  tr:hover td { background: #f4f4f2; }
  .red  { color: #8b1a1a; }
  .grn  { color: #2a5e1a; }
  .muted { color: #999; }
  .footer { font-size: 10px; color: #ccc; padding: 8px 14px; border-top: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">📊 GEX Dashboard &nbsp;2026-10-16 &nbsp;|&nbsp; Last updated: 2026-10-16 07:04 PST</span>
  <div class="page-links">

</div>

<script>

7.5, "cw": 257.5, "pw": 252.5}, {"time": "07:04", "spot": 253.54, "gex_display": 37.9, "gex_unit": "M", "gex_at": 260.0, "gex2_display": -34.9, "gex2_unit": "M", "gex2_at": 250.0, "gex3_display": 27.3, "gex3_unit": "M", "gex3_at": 257.5, "net_gamma_display": 20.8, "net_gamma_unit": "M", "call_gamma_display": 264.3, "call_gamma_unit": "M", "put_gamma_display": -243.5, "put_gamma_unit": "M", "mp": 255.0, "cw": 260.0, "pw": 250.0}], "SPCX": [{"time": "06:34", "spot": 145.18, "gex_display": -11.4, "gex_unit": "M", "gex_at": 140.0, "gex2_display": -6.9, "gex2_unit": "M", "gex2_at": 145.0, "gex3_display": -6.7, "gex3_unit": "M", "gex3_at": 135.0, "net_gamma_display": -33.1, "net_gamma_unit": "M", "call_gamma_display": 77.2, "call_gamma_unit": "M", "put_gamma_display": -110.3, "put_gamma_unit": "M", "mp": 147.0, "cw": 155.0, "pw": 140.0}, {"time": "06:44", "spot": 145.27, "gex_display": -11.3, "gex_unit": "M", "gex_at": 145.0, "gex2_display": -9.8, "gex2_unit": "M", "gex2_at": 140.0, "gex3_display": -6.3, "gex3_unit": "M", "gex3_at": 150.0, "net_gamma_display": -40.1, "net_gamma_unit": "M", "call_gamma_display": 81.6, "call_gamma_unit": "M", "put_gamma_display": -121.6, "put_gamma_unit": "M", "mp": 147.0, "cw": 165.0, "pw": 145.0}, {"time": "07:04", "spot": 146.26, "gex_display": -9.0, "gex_unit": "M", "gex_at": 145.0, "gex2_display": -6.6, "gex2_unit": "M", "gex2_at": 150.0, "gex3_display": -6.3, "gex3_unit": "M", "gex3_at": 143.0, "net_gamma_display": -28.4, "net_gamma_unit": "M", "call_gamma_display": 93.5, "call_gamma_unit": "M", "put_gamma_display": -121.8, "put_gamma_unit": "M", "mp": 147.0, "cw": 155.0, "pw": 145.0}]};
const tickers = ["MSFT", "AMZN", "SPCX"];

const tabContainer = document.getElementById("tab-container");
const panelContainer = document.getElementById("panel-container");

tickers.forEach((ticker, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = ticker;
  btn.onclick = () => show(ticker, btn);
  tabContainer.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = ticker;
  panel.className = "panel" + (i === 0 ? " active" : "");
  const rows = data[ticker] || [];
  const rowsHtml = rows.map(r => {
    const fmtGex = (display, unit, at) => {
      if (display === null || display === undefined) return {html: "<span class=\"muted\">—</span>", cls: "muted"};
      const isRed = display < 0;
      const abs = Math.abs(display);
      const u = abs >= 1000 ? (abs/1000).toFixed(1)+"B" : abs+unit;
      const atStr = (at === null || at === undefined) ? "" : (" @$" + at);
      const gexStr = (isRed ? "-" : "+") + "$" + u + atStr;
      const cls = isRed ? "red" : "grn";
      const dot = isRed ? "🔴" : "🟢";
      return {html: dot + " " + gexStr, cls: cls};
    };
    const g1 = fmtGex(r.gex_display, r.gex_unit, r.gex_at);
    const g2 = fmtGex(r.gex2_display, r.gex2_unit, r.gex2_at);
    const g3 = fmtGex(r.gex3_display, r.gex3_unit, r.gex3_at);
    const ng = fmtGex(r.net_gamma_display, r.net_gamma_unit, null);
    const cg = fmtGex(r.call_gamma_display, r.call_gamma_unit, null);
    const pg = fmtGex(r.put_gamma_display, r.put_gamma_unit, null);
    return "<tr><td>" + r.time + "</td><td>$" + r.spot.toFixed(2) + "</td>"
      + "<td class=\"" + g1.cls + "\">" + g1.html + "</td>"
      + "<td class=\"" + g2.cls + "\">" + g2.html + "</td>"
      + "<td class=\"" + g3.cls + "\">" + g3.html + "</td>"
      + "<td class=\"" + ng.cls + "\">" + ng.html + "</td>"
      + "<td class=\"" + cg.cls + "\">" + cg.html + "</td>"
      + "<td class=\"" + pg.cls + "\">" + pg.html + "</td>"
      + "<td class=\"muted\">$" + r.mp + "</td>"
      + "<td class=\"muted\">$" + r.cw + "</td>"
      + "<td class=\"muted\">$" + r.pw + "</td></tr>";
  }).join("");
  panel.innerHTML = "<table><thead><tr><th>Time</th><th>Price</th><th>GEX</th><th>GEX2</th><th>GEX3</th><th>Net Gamma</th><th>Call Gamma</th><th>Put Gamma</th><th>MP</th><th>CW</th><th>PW</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>";
  panelContainer.appendChild(panel);
});

function show(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
</script>
</body>
